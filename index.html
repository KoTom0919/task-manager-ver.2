<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>タスク管理</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">
  <header>
    <h1>タスク管理</h1>
  </header>

  <main>
    <!-- タスク追加画面 -->
    <section id="inputScreen" class="screen active">
      <form id="taskForm" class="panel form-grid">
        <h2 id="formTitle">タスクを追加</h2>

        <label class="field full">
          <span>タスク名</span>
          <input id="taskName" type="text" maxlength="60" required>
        </label>

        <fieldset class="full">
          <legend>予定の決め方</legend>

          <div class="choice">
            <label>
              <input type="radio" name="mode" value="fixed" checked>
              <span>開始時刻を指定</span>
            </label>

            <label>
              <input type="radio" name="mode" value="auto">
              <span>所要時間から自動配置</span>
            </label>
          </div>
        </fieldset>

        <label id="startField" class="field">
          <span>開始時刻</span>
          <input id="startAt" type="datetime-local" step="900">
        </label>

        <label class="field">
          <span id="endLabel">終了時刻</span>
          <input id="endAt" type="datetime-local" step="900" required>
        </label>

        <div id="autoFields" class="auto-fields full hidden">
          <label class="field">
            <span>所要時間</span>

            <div class="duration">
              <input id="duration" type="number" min="1" value="60">

              <select id="durationUnit">
                <option value="minutes">分</option>
                <option value="hours">時間</option>
              </select>
            </div>
          </label>

          <fieldset>
            <legend>中断</legend>

            <div class="choice">
              <label>
                <input type="radio" name="interrupt" value="true" checked>
                <span>中断できる</span>
              </label>

              <label>
                <input type="radio" name="interrupt" value="false">
                <span>中断できない</span>
              </label>
            </div>
          </fieldset>
        </div>

        <label class="field full">
          <span>メモ</span>
          <textarea id="memo" maxlength="300"></textarea>
        </label>

        <fieldset class="full">
          <legend>表示色</legend>
          <div id="colors" class="colors"></div>
        </fieldset>

        <p id="formError" class="error full"></p>

        <div class="form-actions full">
          <button
            id="cancelEdit"
            class="secondary hidden"
            type="button"
          >
            編集をキャンセル
          </button>

          <button
            id="submitTask"
            class="primary"
            type="submit"
          >
            追加
          </button>
        </div>
      </form>
    </section>

    <!-- 予定表画面 -->
    <section id="scheduleScreen" class="screen">
      <div class="panel schedule-tools no-print">
        <button id="openSettings" class="secondary" type="button">
          設定
        </button>

        <div class="period">
          <label class="field">
            <span>表示開始日</span>
            <input id="viewStart" type="date">
          </label>

          <span>～</span>

          <label class="field">
            <span>表示終了日</span>
            <input id="viewEnd" type="date">
          </label>

          <button id="today" class="today" type="button">
            今日
          </button>

          <button id="showAll" class="secondary" type="button">
            すべて表示
          </button>
        </div>
      </div>

      <div class="panel">
        <div class="section-head">
          <div>
            <h2>予定表</h2>
            <p id="resultMessage"></p>
          </div>

          <button id="print" class="secondary no-print" type="button">
            印刷する
          </button>
        </div>

        <div id="schedule" class="schedule-scroll"></div>
        <div id="failed"></div>
      </div>
    </section>

    <!-- 一覧画面 -->
    <section id="listScreen" class="screen">
      <div class="panel">
        <div class="section-head">
          <h2>タスク一覧</h2>

          <button id="clearTasks" class="danger" type="button">
            すべて削除
          </button>
        </div>

        <h3>実行中タスク</h3>

        <div class="filter">
          <span>終了日</span>
          <input id="activeFrom" type="date">
          <span>～</span>
          <input id="activeTo" type="date">

          <button
            data-clear-filter="active"
            class="secondary"
            type="button"
          >
            解除
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>タスク名</th>
                <th>開始時刻／所要時間</th>
                <th>終了時刻</th>
                <th>メモ</th>
              </tr>
            </thead>

            <tbody id="activeBody"></tbody>
          </table>
        </div>

        <h3 class="completed-title">完了済みタスク</h3>

        <div class="filter">
          <span>完了日</span>
          <input id="doneFrom" type="date">
          <span>～</span>
          <input id="doneTo" type="date">

          <button
            data-clear-filter="done"
            class="secondary"
            type="button"
          >
            解除
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>タスク名</th>
                <th>開始時刻／所要時間</th>
                <th>完了時刻</th>
                <th>メモ</th>
              </tr>
            </thead>

            <tbody id="doneBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav no-print">
    <button data-screen="inputScreen" class="active" type="button">
      タスクを追加
    </button>

    <button data-screen="scheduleScreen" type="button">
      予定表
    </button>

    <button data-screen="listScreen" type="button">
      一覧で見る
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <!-- タスク詳細 -->
  <dialog id="detailDialog">
    <div class="dialog-box">
      <h2>タスク詳細</h22>

      <dl>
        <div>
          <dt>タスク名</dt>
          <dd id="detailName"></dd>
        </div>

        <div>
          <dt id="detailType">開始時刻</dt>
          <dd id="detailValue"></dd>
        </div>

        <div>
          <dt>終了時刻</dt>
          <dd id="detailEnd"></dd>
        </div>

        <div>
          <dt>メモ</dt>
          <dd id="detailMemo"></dd>
        </div>
      </dl>

      <div class="dialog-actions">
        <button id="editTask" class="secondary" type="button">
          編集
        </button>

        <button id="closeDetail" type="button">
          キャンセル
        </button>

        <button id="completeTask" class="complete" type="button">
          完了
        </button>
      </div>
    </div>
  </dialog>

  <!-- 時間枠設定 -->
  <dialog id="settingsDialog">
    <div class="dialog-box settings-box">
      <div class="dialog-title">
        <h2>時間枠の設定</h2>

        <button id="closeSettings" class="icon-button" type="button">
          ×
        </button>
      </div>

      <div class="tabs">
        <button
          data-setting-tab="base"
          class="active"
          type="button"
        >
          基底の設定
        </button>

        <button
          data-setting-tab="special"
          type="button"
        >
          個別の設定
        </button>
      </div>

      <!-- 基底設定 -->
      <section id="baseSettings" class="setting-page active">
        <form id="baseForm">
          <p>個別設定がない日に使用します。</p>

          <div class="setting-time-grid">
            <label class="field">
              <span>開始時刻</span>
              <input id="baseStart" type="time" step="900" required>
            </label>

            <label class="field">
              <span>終了時刻</span>
              <input id="baseEnd" type="time" step="900" required>
            </label>
          </div>

          <fieldset>
            <legend>休憩</legend>

            <div class="choice">
              <label>
                <input type="radio" name="baseBreak" value="true">
                <span>休憩あり</span>
              </label>

              <label>
                <input type="radio" name="baseBreak" value="false">
                <span>休憩なし</span>
              </label>
            </div>
          </fieldset>

          <div id="baseBreakTimes" class="setting-time-grid">
            <label class="field">
              <span>休憩開始</span>
              <input id="baseBreakStart" type="time" step="900">
            </label>

            <label class="field">
              <span>休憩終了</span>
              <input id="baseBreakEnd" type="time" step="900">
            </label>
          </div>

          <p id="baseError" class="error"></p>

          <button class="primary wide-button" type="submit">
            設定する
          </button>
        </form>
      </section>

      <!-- 個別設定 -->
      <section id="specialSettings" class="setting-page">
        <form id="specialForm">
          <label class="field">
            <span>日付</span>
            <input id="specialDate" type="date" required>
          </label>

          <div class="setting-time-grid">
            <label class="field">
              <span>開始時刻</span>
              <input id="specialStart" type="time" step="900" required>
            </label>

            <label class="field">
              <span>終了時刻</span>
              <input id="specialEnd" type="time" step="900" required>
            </label>
          </div>

          <fieldset>
            <legend>休憩</legend>

            <div class="choice">
              <label>
                <input type="radio" name="specialBreak" value="true">
                <span>休憩あり</span>
              </label>

              <label>
                <input type="radio" name="specialBreak" value="false">
                <span>休憩なし</span>
              </label>
            </div>
          </fieldset>

          <div id="specialBreakTimes" class="setting-time-grid">
            <label class="field">
              <span>休憩開始</span>
              <input id="specialBreakStart" type="time" step="900">
            </label>

            <label class="field">
              <span>休憩終了</span>
              <input id="specialBreakEnd" type="time" step="900">
            </label>
          </div>

          <p id="specialError" class="error"></p>

          <button class="primary wide-button" type="submit">
            設定する
          </button>
        </form>

        <h3>登録済みの個別設定</h3>
        <div id="specialList" class="special-list"></div>
      </section>
    </div>
  </dialog>
</div>

<script src="script.js"></script>
</body>
</html>
